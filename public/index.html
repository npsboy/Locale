<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Locale</title>
<link rel="icon" href="assets/favicon.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=my_location" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="stageWrap">
    <div id="stage">
      <picture>
        <source media="(max-width: 700px)" srcset="assets/game_background_mobile.png" />
        <img id="bgImage" src="assets/game_background.png" alt="" />
      </picture>

      <!-- source / date row -->
      <div class="ov" id="sourceName">The Hindu</div>
      <div class="ov" id="dispatchDate">14 September 2026</div>

      <!-- story card -->
      <div class="ov" id="storyArea">
        <div class="story-kicker" id="storyKicker">LIVE DISPATCH — LOCATION REDACTED</div>
        <div id="storyText">Loading a mysterious dispatch...</div>
        <div id="resultInline" class="hidden">
          <div id="resultHeadline"></div>
          <div id="resultDetail"></div>
        </div>
      </div>

      <!-- map -->
      <div class="ov" id="mapArea">
        <div id="map"></div>
        <div id="distanceBadge" class="hidden"></div>
      </div>

      <!-- cold/hot proximity gauge -->
      <div class="ov" id="gaugeWrap">
        <div id="gaugeTrack"></div>
        <div id="gaugeMarkers"></div>
        <div id="gaugeHint">Hot or Cold?</div>
      </div>

      <!-- invisible hotspots over the baked-in buttons -->
      <button class="ov hotspot" id="zoomInBtn" aria-label="Zoom in"></button>
      <button class="ov hotspot" id="zoomOutBtn" aria-label="Zoom out"></button>
      <button class="ov hotspot" id="resetPinBtn" aria-label="Reset pin"></button>
      <button class="ov" id="guessBtn" disabled aria-label="Submit guess">Submit Guess</button>

      <!-- score / streak -->
      <div class="ov stat-value" id="totalScore"></div>
      <div class="ov stat-value" id="streakVal">0</div>

      <!-- share button, shown once the day's game is finished -->
      <button class="ov" id="shareBtn" hidden>Share your score</button>
    </div>
  </div>

  <!-- fullscreen share overlay -->
  <div id="shareOverlay" class="hidden" role="dialog" aria-modal="true" aria-label="Share your score">
    <div id="shareOverlayInner">
      <button id="shareCloseBtn" aria-label="Close">&times;</button>
      <div id="shareResultHeading"></div>
      <div id="nextDispatchNotice">New dispatch tomorrow at 6 AM</div>
      <canvas id="shareCanvas" width="1080" height="1080"></canvas>
      <div id="shareStatus" aria-live="polite"></div>
      <div id="shareActions">
        <button id="shareNativeBtn" class="share-action-btn" hidden>
          <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
          <span>Share…</span>
        </button>
        <button id="shareXBtn" class="share-action-btn">
          <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2h3.3l-7.2 8.2L23.4 22h-6.6l-5.2-6.8L5.7 22H2.4l7.7-8.8L1.6 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.8L7.4 4h-2l12.3 16Z"/></svg>
          <span>Share on X</span>
        </button>
        <button id="shareFbBtn" class="share-action-btn">
          <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/></svg>
          <span>Share on Facebook</span>
        </button>
        <button id="shareIgBtn" class="share-action-btn">
          <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          <span>Share on Instagram</span>
        </button>
        <button id="shareCopyBtn" class="share-action-btn">
          <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span>Copy image</span>
        </button>
        <button id="shareDownloadBtn" class="share-action-btn">
          <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Download</span>
        </button>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="game.js"></script>
</body>
</html>
